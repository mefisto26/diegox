name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      # Formato (Solo advierte si hay diferencias, no aborta el flujo)
      - name: Check Code Formatting
        run: cargo fmt --all -- --check || echo "Format with warnings"

      # Clippy Lints (Muestra advertencias pero no falla la compilación)
      - name: Run Clippy Lints
        run: cargo clippy

      - name: Run Unit & Integration Tests
        run: cargo test --all --verbose

      - name: Build Application (Release)
        run: cargo build --release --verbose